apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: ghcr.io/spideyx883/vote:3988a13b9109fac70e2f1aa8df407f328b40f017
        name: vote
        ports:
        - containerPort: 80
          name: vote
