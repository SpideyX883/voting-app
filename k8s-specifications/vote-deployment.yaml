apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: ghcr.io/spideyx883/vote:6da005f8222b16854712a6d159d8f6335a251d4e
        name: vote
        ports:
        - containerPort: 80
          name: vote
