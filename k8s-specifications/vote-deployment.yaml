apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: ghcr.io/spideyx883/vote:2e8004268e89bb8c3b04a309655c422e49e415f0
        name: vote
        ports:
        - containerPort: 80
          name: vote
