apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: ghcr.io/spideyx883/vote:5175af457891928883dad587a05d206aff8e1c69
        name: vote
        ports:
        - containerPort: 80
          name: vote
