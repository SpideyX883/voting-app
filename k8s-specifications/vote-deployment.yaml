apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: ghcr.io/spideyx883/vote:739afb17b86e0e8478a7f071634d494b7cff91d0
        name: vote
        ports:
        - containerPort: 80
          name: vote
